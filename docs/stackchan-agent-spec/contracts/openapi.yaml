# FROZEN v0.1 API contract - not a deployed service.
# Local relative $refs require schema files in the same folder.
openapi: 3.1.0
info:
  title: StackChan Coordinator Candidate HTTP API
  version: 0.1.0
  description: |
    FROZEN contract surface for Gate G1 (P1-02). Not implemented or deployed.
    Bearer tokens are opaque and short-lived. mDNS discovery is not authentication.
    WebSocket device stream uses DeviceStreamEnvelope; NotificationIntent payloads
    are validated with notification-intent.schema.json when type=notification.intent.
servers:
  - url: https://coordinator.example.invalid
    description: Illustrative hostname ONLY; replace during deployment
security:
  - bearerAuth: []
tags:
  - name: Bridge
  - name: Dashboard
  - name: Devices
  - name: Pairing
  - name: Admin
paths:
  /v1/events/batch:
    post:
      operationId: submitEventBatch
      summary: Bridge idempotent event submission
      tags: [Bridge]
      x-required-scopes: [bridge:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Contiguous ack cursor and gaps for the authenticated bridge
      tags: [Bridge]
      x-required-scopes: [bridge:sync]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/events:
    get:
      operationId: listEvents
      summary: Privacy-filtered AgentEvent history; pagination TBD
      tags: [Dashboard]
      x-required-scopes: [dashboard:read]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentEvent'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/notifications/pending:
    get:
      operationId: listPendingNotifications
      summary: Personal-edition pending NotificationIntent queue (TTL applied)
      tags: [Dashboard]
      x-required-scopes: [dashboard:read]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/events/{eventId}/read:
    post:
      operationId: markRead
      summary: Explicit global read marking
      tags: [Dashboard]
      x-required-scopes: [read:write]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/devices:
    get:
      operationId: listDevices
      summary: Read-only paired devices summary
      tags: [Dashboard]
      x-required-scopes: [dashboard:read]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [device_id, status]
                  properties:
                    device_id:
                      type: string
                    status:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/devices/{deviceId}/policy:
    get:
      operationId: getPolicy
      summary: Device-scoped current verified policy
      tags: [Devices]
      x-required-scopes: [device:policy]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/deliveries/{deliveryId}/receipts:
    post:
      operationId: submitReceipt
      summary: Device presentation receipt
      tags: [Devices]
      x-required-scopes: [device:receipt]
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationReceipt'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                type: object
                required: [receipt_id, accepted]
                properties:
                  receipt_id:
                    type: string
                  accepted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/pairing/sessions:
    post:
      operationId: startPairing
      summary: Start explicit human-approved pairing challenge
      tags: [Pairing]
      security: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingStartRequest'
      responses:
        '200':
          description: Challenge created; user must confirm out-of-band
          headers:
            X-StackChan-Pairing-Claim:
              description: Secret issued to the initiating device for one-time redemption. Keep in RAM and out of logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/pairing/sessions/{pairingId}/confirm:
    post:
      operationId: confirmPairing
      summary: Human confirmation of pairing challenge
      tags: [Pairing]
      x-required-scopes: [admin:pairing]
      parameters:
        - name: pairingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConfirmRequest'
      responses:
        '200':
          description: Confirmation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/pairing/sessions/{pairingId}/complete:
    post:
      operationId: completePairing
      summary: Issue short-lived scoped token after approved pairing
      tags: [Pairing]
      security: []
      x-required-scopes: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema:
            type: string
        - name: X-StackChan-Pairing-Claim
          in: header
          required: true
          description: Claim secret returned to the initiating device when the session was created.
          schema:
            type: string
      responses:
        '200':
          description: Pairing complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/health:
    get:
      operationId: getHealth
      summary: Minimal health without secrets
      tags: [Admin]
      x-required-scopes: [admin:health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                  version:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/device-stream:
    get:
      operationId: openDeviceStream
      summary: WebSocket upgrade for device notification stream
      tags: [Devices]
      x-required-scopes: [device:stream]
      description: |
        HTTP GET is the upgrade handshake placeholder. Frames MUST be
        DeviceStreamEnvelope JSON objects. Unauthorized or wrong-scope tokens
        MUST be rejected before any notification payload is accepted.
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-or-bridge-token
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but missing required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Version or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AgentEvent:
      $ref: ./agent-event.schema.json
    NotificationIntent:
      $ref: ./notification-intent.schema.json
    PresentationReceipt:
      $ref: ./presentation-receipt.schema.json
    DeviceStreamEnvelope:
      $ref: ./device-stream-envelope.schema.json
    Error:
      $ref: ./error.schema.json
    PairingStartRequest:
      $ref: ./pairing.schema.json#/$defs/PairingStartRequest
    PairingChallenge:
      $ref: ./pairing.schema.json#/$defs/PairingChallenge
    PairingConfirmRequest:
      $ref: ./pairing.schema.json#/$defs/PairingConfirmRequest
    PairingCompleteResponse:
      $ref: ./pairing.schema.json#/$defs/PairingCompleteResponse
    BatchInput:
      type: object
      additionalProperties: false
      required: [bridge_id, epoch, events]
      properties:
        bridge_id:
          type: string
        epoch:
          type: string
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AgentEvent'
    BatchAck:
      type: object
      additionalProperties: false
      required:
        - bridge_id
        - epoch
        - contiguous_acked_sequence
        - accepted_event_ids
        - missing_sequences
      properties:
        bridge_id:
          type: string
        epoch:
          type: string
        contiguous_acked_sequence:
          type: integer
          minimum: 0
        accepted_event_ids:
          type: array
          items:
            type: string
        missing_sequences:
          type: array
          items:
            type: integer
    ReadRequest:
      type: object
      additionalProperties: false
      required: [operation_id, expected_version]
      properties:
        operation_id:
          type: string
        expected_version:
          type: integer
          minimum: 0
    ReadResponse:
      type: object
      additionalProperties: false
      required: [event_id, read, version]
      properties:
        event_id:
          type: string
        read:
          type: boolean
        version:
          type: integer
          minimum: 0
    Policy:
      type: object
      additionalProperties: false
      required: [policy_id, version, privacy_mode, valid_until]
      properties:
        policy_id:
          type: string
        version:
          type: string
        privacy_mode:
          type: string
          enum: [private, public, strict]
        valid_until:
          type: string
          format: date-time
        revoked:
          type: boolean
