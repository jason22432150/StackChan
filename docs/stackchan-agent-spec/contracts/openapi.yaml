# PROPOSED contract - no deployed API; local relative $refs require schema files in same folder
openapi: 3.1.0
info:
  title: StackChan Coordinator Candidate HTTP API
  version: 0.1.0
  description: PROPOSED contract only. Not implemented or deployed. WebSocket and
    pairing handshake are Phase-0/G1 pending.
servers:
- url: https://coordinator.example.invalid
  description: Illustrative hostname ONLY; replace during deployment
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-or-bridge-token
  schemas:
    AgentEvent:
      $ref: ./agent-event.schema.json
    PresentationReceipt:
      $ref: ./presentation-receipt.schema.json
    BatchInput:
      type: object
      required:
      - bridge_id
      - epoch
      - events
      properties:
        bridge_id:
          type: string
        epoch:
          type: string
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AgentEvent'
    BatchAck:
      type: object
      required:
      - bridge_id
      - epoch
      - contiguous_acked_sequence
      - accepted_event_ids
      - missing_sequences
      properties:
        bridge_id:
          type: string
        epoch:
          type: string
        contiguous_acked_sequence:
          type: integer
          minimum: 0
        accepted_event_ids:
          type: array
          items:
            type: string
        missing_sequences:
          type: array
          items:
            type: integer
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ReadRequest:
      type: object
      required:
      - operation_id
      - expected_version
      properties:
        operation_id:
          type: string
        expected_version:
          type: integer
          minimum: 0
    ReadResponse:
      type: object
      required:
      - event_id
      - read
      - version
      properties:
        event_id:
          type: string
        read:
          type: boolean
        version:
          type: integer
          minimum: 0
    Policy:
      type: object
      required:
      - policy_id
      - version
      - privacy_mode
      - valid_until
      properties:
        policy_id:
          type: string
        version:
          type: string
        privacy_mode:
          enum:
          - private
          - public
          - strict
        valid_until:
          type: string
          format: date-time
paths:
  /v1/events/batch:
    post:
      operationId: submitEventBatch
      summary: Bridge idempotent event submission
      tags:
      - Bridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAck'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Version conflict
  /v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Contiguous ack cursor and gaps (filter by authenticated bridge)
      tags:
      - Bridge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAck'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /v1/events:
    get:
      operationId: listEvents
      summary: Privacy-filtered AgentEvent history; pagination TBD
      tags:
      - Dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentEvent'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /v1/events/{eventId}/read:
    post:
      operationId: markRead
      summary: Explicit global read marking
      tags:
      - Dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Version conflict
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
  /v1/devices:
    get:
      operationId: listDevices
      summary: Read-only paired devices summary
      tags:
      - Dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: string
                    status:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /v1/devices/{deviceId}/policy:
    get:
      operationId: getPolicy
      summary: Device-scoped current verified policy
      tags:
      - Devices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
  /v1/deliveries/{deliveryId}/receipts:
    post:
      operationId: submitReceipt
      summary: Device presentation receipt
      tags:
      - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationReceipt'
      responses:
        '200':
          description: Accepted or idempotent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt_id:
                    type: string
                  accepted:
                    type: boolean
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Version conflict
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
  /v1/health:
    get:
      operationId: getHealth
      summary: Minimal health without sensitive data
      tags:
      - Admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
