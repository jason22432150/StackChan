[project]
name = "stackchan"
version = "0.1.0"
description = "StackChan agent notification contracts and host-side services"
readme = "README.md"
authors = [
    { name = "Guo_Mac", email = "nmsl22432150@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.23.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
stackchan = "stackchan:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
